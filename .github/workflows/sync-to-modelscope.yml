name: Sync to ModelScope

# 每次 push 到 master 分支，自动把代码镜像同步到魔搭创空间 haoloveli
# 魔搭创空间会在收到 push 后自动重新部署静态站点（由 README 顶部 front matter 中的 deployspec 驱动）
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          echo "Git config set"

      - name: Validate ModelScope token
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          if [ -z "${MODELSCOPE_TOKEN}" ]; then
            echo "ERROR: secrets.MODELSCOPE_TOKEN is NOT configured!"
            echo "Fix: https://github.com/codengseam/haoloveli/settings/secrets/actions"
            exit 1
          else
            TOKEN_LEN=${#MODELSCOPE_TOKEN}
            echo "MODELSCOPE_TOKEN is configured (length=${TOKEN_LEN})"
          fi

      - name: Sync to ModelScope
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          set -x

          MS_REPO="https://oauth2:${MODELSCOPE_TOKEN}@www.modelscope.cn/studios/codengseam/haoloveli.git"

          # 禁用 LFS 验证：魔搭 GitLab 的 pre-receive hook 会因 LFS 对象缺失拒绝推送
          # 本项目是纯静态站点，无需 LFS；.gitattributes 已移除 ML LFS 规则
          git config lfs.${MS_REPO#https://}.locksverify false
          git config lfs.www.modelscope.cn.locksverify false

          # 添加 modelscope remote
          git remote add modelscope "${MS_REPO}" 2>/dev/null || git remote set-url modelscope "${MS_REPO}"

          push_with_retry() {
            local max=5 delay=10
            local rc
            for i in $(seq 1 $max); do
              echo ""
              echo "--- Push attempt $i/$max (target: ${GITHUB_REF_NAME}:master) ---"
              # FIX: capture $? BEFORE any other command (local declaration resets $?)
              git push modelscope "${GITHUB_REF_NAME}:master" 2>&1
              rc=$?
              if [ $rc -eq 0 ]; then
                echo "SUCCESS: Push succeeded on attempt $i"
                return 0
              fi
              echo "FAILED: Push attempt $i/$max failed (exit code=$rc). Retrying in ${delay}s..."
              [ "$i" -lt "$max" ] && sleep "$delay"
              delay=$((delay * 2))
            done
            echo "FAILED: All $max push attempts failed"
            return 1
          }

          echo ""
          echo "=== Step 1: Testing ModelScope connectivity ==="
          if git ls-remote modelscope master 2>&1 | head -5; then
            echo "OK: ModelScope connection reachable"
          else
            echo "WARN: ls-remote test failed (may still be pushable)"
          fi

          echo ""
          echo "=== Step 2: Attempting direct push ==="
          if ! push_with_retry; then
            echo ""
            echo "=== Step 3: Direct push rejected. Trying merge + retry ==="
            echo "Fetching modelscope/master for unrelated-history merge..."
            if git fetch modelscope master --depth=1 2>&1; then
              echo "OK: Fetched modelscope/master"
              echo "Merging modelscope/master with -X ours..."
              if git merge --no-edit --allow-unrelated-histories -X ours modelscope/master 2>&1; then
                echo "OK: Merge succeeded. Retrying push..."
                push_with_retry
              else
                echo "ERROR: Merge failed"
                git merge --abort 2>/dev/null || true
                echo "Aborted merge attempt"
                return 1
              fi
            else
              echo "ERROR: Cannot fetch modelscope/master. Token may be invalid or network blocked."
              return 1
            fi
          fi

          echo ""
          echo "=== Step 4: Cleaning up stray main branch ==="
          git push modelscope --delete main 2>&1 || echo "No main branch to delete (non-critical)"

          echo ""
          echo "=== DONE: Sync completed successfully ==="
